
workflows:
  nely_bely_android:
    name: Nely Bely APK Build

    environment:
      flutter: 3.7.12

    scripts:
      - name: Extract Flutter Project
        script: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ZIP project tidak ditemukan!"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=$(dirname "$(find extracted -name pubspec.yaml | head -n 1)")

          if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/pubspec.yaml" ]; then
            echo "pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR"

          cd "$PROJECT_DIR"

          flutter pub get
          flutter build apk --release

    artifacts:
      - extracted/**/build/app/outputs/flutter-apk/app-release.apk
